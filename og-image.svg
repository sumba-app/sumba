<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#eceee9"/>
  <circle cx="1180" cy="300" r="320" fill="#bff05f" opacity="0.16"/>
  <circle cx="1120" cy="900" r="240" fill="#173a2b" opacity="0.06"/>

  <!-- logo -->
  <g transform="translate(92,300)">
    <rect width="66" height="66" rx="18" fill="#bff05f"/>
    <g transform="translate(9,9) scale(2)" fill="none" stroke="#15241d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 11.5 L12 5.5 L19.5 11.5 V20 H4.5 Z"/>
      <path d="M7.5 17 L10.5 14 L12.5 15.5 L16.2 11.8"/>
      <path d="M13.9 11.8 H16.4 V14.3"/>
    </g>
    <text x="84" y="46" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" fill="#15241d" letter-spacing="-1">Sumba</text>
  </g>

  <!-- headline -->
  <g font-family="'Helvetica Neue',Arial,sans-serif" fill="#15241d" font-weight="800" letter-spacing="-2">
    <text x="90" y="500" font-size="72">L'immobilier,</text>
    <rect x="88" y="528" width="238" height="58" rx="8" fill="#bff05f"/>
    <text x="92" y="576" font-size="72">chiffré <tspan>avant</tspan></text>
    <text x="90" y="652" font-size="72">de vous lancer.</text>
  </g>

  <!-- subtitle -->
  <text x="92" y="730" font-family="'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="500" fill="#46544c">Capacité d'emprunt · Rentabilité locative · Fiscalité</text>

  <!-- footer -->
  <text x="92" y="800" font-family="'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#2f8f56">sumba.fr<tspan font-weight="500" fill="#838d85" dx="22">— gratuit, sans inscription</tspan></text>
</svg>

<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<title>Mon compte | Sumba</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#eceee9;--surface:#ffffff;--surface-2:#f4f6f1;--surface-3:#eef1ea;
  --ink:#15241d;--ink-2:#46544c;--ink-3:#838d85;
  --line:#e4e7df;--lime:#bff05f;--lime-2:#aee63f;--lime-soft:#e9f9c8;
  --forest:#173a2b;--green-acc:#2f8f56;--danger:#c0392b;--danger-soft:#fdeceb;
  --pill:999px;--ease:cubic-bezier(0.16,1,0.3,1);
  --sh:0 1px 2px rgba(20,40,30,.04),0 10px 30px rgba(20,40,30,.05);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;
  background:rgba(236,238,233,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.nl{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nlm{width:36px;height:36px;background:var(--lime);border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(150,220,80,.45);}
.nlm svg{width:23px;height:23px;}
.nlt{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--ink);}
.nr{display:flex;gap:8px;}
.bsm{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:var(--pill);cursor:pointer;transition:all .2s;text-decoration:none;border:none;}
.bo{color:var(--ink-2);background:var(--surface);border:1px solid var(--line);}
.bo:hover{border-color:var(--ink-3);color:var(--ink);}
.page{padding:104px 24px 48px;max-width:920px;margin:0 auto;}
.page-header{margin-bottom:28px;}
.page-header h1{font-size:32px;font-weight:800;letter-spacing:-0.03em;margin-bottom:5px;}
.page-header p{font-size:14.5px;color:var(--ink-2);}
.user-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 26px;display:flex;align-items:center;gap:16px;margin-bottom:30px;box-shadow:var(--sh);}
.avatar{width:52px;height:52px;background:var(--forest);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff;flex-shrink:0;}
.user-info strong{display:block;font-size:16.5px;font-weight:700;}
.user-info span{font-size:13.5px;color:var(--ink-3);}
.logout-btn{margin-left:auto;font-family:inherit;font-size:13px;font-weight:600;color:var(--danger);background:var(--danger-soft);border:1px solid rgba(192,57,43,.15);border-radius:var(--pill);padding:8px 16px;cursor:pointer;transition:all .2s;}
.logout-btn:hover{background:#f9dcd8;}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:14px;}
.sims-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:36px;}
.sim-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:16px;transition:all .3s var(--ease);cursor:pointer;}
.sim-card:hover{border-color:var(--lime-2);transform:translateY(-2px);box-shadow:var(--sh);}
.sim-ico{width:44px;height:44px;border-radius:12px;background:var(--lime-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sim-info{flex:1;min-width:0;}
.sim-name{font-size:15px;font-weight:700;color:var(--ink);}
.sim-meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.sim-val{font-size:17px;font-weight:800;color:var(--green-acc);letter-spacing:-0.02em;white-space:nowrap;}
.sim-actions{display:flex;gap:6px;}
.btn-ico{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;color:var(--ink-2);}
.btn-ico:hover{background:var(--surface-2);border-color:var(--ink-3);}
.btn-ico.del:hover{background:var(--danger-soft);border-color:rgba(192,57,43,.25);color:var(--danger);}
.empty-state{text-align:center;padding:48px 24px;background:var(--surface);border:1.5px dashed var(--line);border-radius:20px;}
.empty-ico{display:flex;justify-content:center;margin-bottom:14px;opacity:.5;}
.empty-state p{font-size:14.5px;color:var(--ink-2);margin-bottom:18px;}
.btn-green{font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);background:var(--lime);border:1px solid rgba(20,40,30,.06);border-radius:var(--pill);padding:13px 26px;cursor:pointer;transition:all .25s var(--ease);text-decoration:none;display:inline-block;box-shadow:0 6px 18px rgba(150,220,80,.4);}
.btn-green:hover{background:var(--lime-2);transform:translateY(-2px);box-shadow:0 12px 26px rgba(150,220,80,.5);}
.rename-modal{position:fixed;inset:0;background:rgba(21,36,29,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;}
.rename-modal.show{display:flex;}
.rename-box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(20,40,30,.22);}
.rename-box h3{font-size:19px;font-weight:800;letter-spacing:-0.02em;margin-bottom:18px;}
.rename-box input{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:16px;}
.rename-box input:focus{outline:none;border-color:var(--lime-2);box-shadow:0 0 0 3px rgba(174,230,63,.22);background:var(--surface);}
.rename-actions{display:flex;gap:10px;}
.btn-cancel{flex:1;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--pill);padding:11px;cursor:pointer;transition:all .2s;}
.btn-cancel:hover{border-color:var(--ink-3);}
.btn-save{flex:1;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--lime);border:none;border-radius:var(--pill);padding:11px;cursor:pointer;transition:all .2s;}
.btn-save:hover{background:var(--lime-2);}
.loading{text-align:center;padding:60px;color:var(--ink-3);font-weight:500;}

@media(max-width:768px){
  nav{padding:12px 16px;}
  .page{padding:88px 16px 36px;}
  .page-header h1{font-size:26px;}
  .user-card{flex-wrap:wrap;gap:12px;padding:18px;}
  .logout-btn{margin-left:0;}
  .sim-card{flex-wrap:wrap;gap:12px;padding:16px;}
  .sim-actions{margin-left:auto;}
  .rename-box{margin:0 4px;}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nl">
    <div class="nlm"><svg viewBox="0 0 24 24" fill="none" stroke="#15241d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 L12 5.5 L19.5 11.5 V20 H4.5 Z"/><path d="M7.5 17 L10.5 14 L12.5 15.5 L16.2 11.8"/><path d="M13.9 11.8 H16.4 V14.3"/></svg></div>
    <span class="nlt">Sumba</span>
  </a>
  <div class="nr">
    <a href="simulateur.html" class="bsm bo">← Simulateur</a>
  </div>
</nav>

<div class="page">
  <div id="loading" class="loading">Chargement...</div>
  <div id="content" style="display:none">
    <div class="page-header">
      <h1>Mon compte</h1>
      <p>Retrouvez et gérez toutes vos simulations sauvegardées.</p>
    </div>
    <div class="user-card">
      <div class="avatar" id="av">?</div>
      <div class="user-info"><strong id="user-name">-</strong><span id="user-email">-</span></div>
      <button class="logout-btn" onclick="logout()">Se déconnecter</button>
    </div>
    <div class="section-title">Mes simulations</div>
    <div class="sims-grid" id="sims-list"></div>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="rename-modal" id="rename-modal">
  <div class="rename-box">
    <h3>Renommer la simulation</h3>
    <input type="text" id="rename-input" placeholder="Ex: Appart Lyon locatif 2025">
    <div class="rename-actions">
      <button class="btn-cancel" onclick="closeRename()">Annuler</button>
      <button class="btn-save" onclick="saveRename()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zrngovgnkkkhnxdytmyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QRu38MszSvnpwZCz0qcQMw_ITzXLjnE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'sumba-auth',
    flowType: 'pkce'
  }
});

let user = null;
let simulations = [];
let renameId = null;

const ICONS = { capacite:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="#173a2b" stroke-width="1.6"/><path d="M3 10h18" stroke="#173a2b" stroke-width="1.6"/></svg>`, locatif:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 11l7-6 7 6" stroke="#173a2b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 10v8h10v-8" stroke="#173a2b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`, mb:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 10l7-5 7 5" stroke="#173a2b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 9v9h10V9" stroke="#173a2b" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 14h5M12 11.5v5" stroke="#173a2b" stroke-width="1.5" stroke-linecap="round"/></svg>` };
const LABELS = { capacite:'Capacité d\'emprunt', locatif:'Investissement locatif', mb:'Marchand de biens' };

async function init() {
  try {
    // Attendre que la session soit disponible (le SDK peut mettre un instant à
    // traiter le token OAuth présent dans l'URL après une connexion Google).
    let session = (await sb.auth.getSession()).data.session;
    if (!session) {
      session = await attendreSession(2500);
    }
    if (!session) { window.location.href = 'auth.html'; return; }
    user = session.user;
    const prenom = user.user_metadata?.prenom
      || user.user_metadata?.full_name?.split(' ')[0]
      || user.user_metadata?.name?.split(' ')[0] || '';
    const initiale = (prenom || user.email || '?')[0].toUpperCase();
    document.getElementById('av').textContent = initiale;
    document.getElementById('user-name').textContent = prenom || 'Mon compte';
    document.getElementById('user-email').textContent = user.email;
    await loadSims();
  } catch(e) {
    console.error('Erreur init compte:', e);
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// Attend qu'une session s'établisse (utile au retour d'une connexion OAuth Google)
function attendreSession(timeoutMs) {
  return new Promise((resolve) => {
    let resolved = false;
    const sub = sb.auth.onAuthStateChange((_event, session) => {
      if (session && !resolved) { resolved = true; resolve(session); }
    });
    setTimeout(() => {
      if (!resolved) {
        resolved = true;
        sb.auth.getSession().then(({ data }) => resolve(data.session || null));
      }
    }, timeoutMs);
  });
}

async function loadSims() {
  try {
    const { data, error } = await sb.from('simulations').select('*').eq('user_id', user.id).order('updated_at', { ascending: false });
    if (error) { console.error('loadSims error:', error); simulations = []; }
    else simulations = data || [];
  } catch(e) {
    console.error('loadSims exception:', e);
    simulations = [];
  }
  renderSims();
}

function renderSims() {
  const el = document.getElementById('sims-list');
  if (!simulations.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V6M19 19V14" stroke="#2f8f56" stroke-width="1.5" stroke-linecap="round"/><path d="M4 20h16" stroke="#2f8f56" stroke-width="1.5" stroke-linecap="round"/></svg></div><p>Vous n'avez pas encore de simulation sauvegardée.</p><a href="simulateur.html" class="btn-green">Créer ma première simulation</a></div>`;
    return;
  }
  el.innerHTML = simulations.map(s => {
    const d = s.data || {};
    const ico = ICONS[s.type] || `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V6M19 19V14" stroke="#173a2b" stroke-width="1.6" stroke-linecap="round"/><path d="M4 20h16" stroke="#173a2b" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    const lbl = LABELS[s.type] || s.type;
    const date = new Date(s.updated_at).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
    let val = '-';
    if (s.type==='capacite' && d.capital) val = Math.round(d.capital).toLocaleString('fr-FR')+' €';
    if (s.type==='locatif' && d.cf!=null) val = (d.cf>=0?'+':'')+Math.round(d.cf).toLocaleString('fr-FR')+' €/mois';
    if (s.type==='mb' && d.marge!=null) val = (d.marge>=0?'+':'')+Math.round(d.marge).toLocaleString('fr-FR')+' €';
    return `<div class="sim-card" onclick="openSim('${s.id}')">
      <div class="sim-ico">${ico}</div>
      <div class="sim-info">
        <div class="sim-name">${s.name || lbl}</div>
        <div class="sim-meta">${lbl} · ${date}</div>
      </div>
      <div class="sim-val">${val}</div>
      <div class="sim-actions" onclick="event.stopPropagation()">
        <button class="btn-ico" title="Renommer" onclick="openRename('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')">✏️</button>
        <button class="btn-ico del" title="Supprimer" onclick="deleteSim('${s.id}')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>`;
  }).join('');
}

function openSim(id) {
  const sim = simulations.find(s=>s.id===id);
  if (sim) {
    localStorage.setItem('sumba_load_sim', JSON.stringify(sim));
    window.location.href = 'simulateur.html?mod=recap';
  }
}

function openRename(id, name) {
  renameId = id;
  document.getElementById('rename-input').value = name;
  document.getElementById('rename-modal').classList.add('show');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}
function closeRename() {
  renameId = null;
  document.getElementById('rename-modal').classList.remove('show');
}
async function saveRename() {
  const name = document.getElementById('rename-input').value.trim();
  if (!name || !renameId) return;
  await sb.from('simulations').update({ name }).eq('id', renameId);
  closeRename();
  await loadSims();
}

async function deleteSim(id) {
  if (!confirm('Supprimer cette simulation ?')) return;
  await sb.from('simulations').delete().eq('id', id);
  await loadSims();
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

document.getElementById('rename-input').addEventListener('keydown', e => { if (e.key==='Enter') saveRename(); });
init();
</script>

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Sumba - Mon compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0f2942;--gm:#1c4a6e;--gl:#e8b873;--gp:#eef2f6;--gx:#f6f9fb;--cr:#fbfaf8;--w:#fff;--dk:#0f2942;--gr:#6b7280;--grl:#f3f4f6;--bd:rgba(15,41,66,0.1);--cuivre:#e8b873;--cuivre-dark:#c9974f;--rd:#dc2626;--rp:#fef2f2;--am:#d97706;--ap:#fffbeb;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--cr);color:var(--dk);min-height:100vh;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(250,249,246,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);}
.nl{display:flex;align-items:center;gap:9px;text-decoration:none;}
.nlm{width:30px;height:30px;background:var(--g);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.nlm svg{width:22px;height:22px;}
.nlt{font-family:'Spectral',serif;font-size:19px;font-weight:700;color:var(--g);}
.nr{display:flex;gap:8px;}
.bsm{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:6px 16px;border-radius:100px;cursor:pointer;transition:all .2s;text-decoration:none;border:none;}
.bo{color:var(--g);background:none;border:1.5px solid var(--bd);}
.bo:hover{border-color:var(--g);background:var(--gp);}
.bs{color:var(--w);background:var(--g);}
.bs:hover{background:var(--gm);}
.page{padding:96px 24px 40px;max-width:900px;margin:0 auto;}
.page-header{margin-bottom:32px;}
.page-header h1{font-family:'Spectral',serif;font-size:28px;font-weight:700;margin-bottom:4px;}
.page-header p{font-size:14px;color:var(--gr);}
.user-card{background:var(--w);border:1px solid var(--bd);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:16px;margin-bottom:28px;}
.avatar{width:48px;height:48px;background:var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Spectral',serif;font-size:20px;font-weight:700;color:var(--w);flex-shrink:0;}
.user-info strong{display:block;font-size:16px;font-weight:600;}
.user-info span{font-size:13px;color:var(--gr);}
.logout-btn{margin-left:auto;font-family:'Inter',sans-serif;font-size:13px;color:var(--rd);background:var(--rp);border:1px solid rgba(220,38,38,.15);border-radius:100px;padding:6px 14px;cursor:pointer;transition:all .2s;}
.logout-btn:hover{background:#fee2e2;}
.section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--gr);margin-bottom:12px;}
.sims-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.sim-card{background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer;}
.sim-card:hover{border-color:var(--gl);background:var(--gx);transform:translateY(-1px);}
.sim-ico{font-size:22px;width:36px;text-align:center;}
.sim-info{flex:1;}
.sim-name{font-size:14px;font-weight:600;color:var(--dk);}
.sim-meta{font-size:12px;color:var(--gr);margin-top:2px;}
.sim-val{font-family:'Spectral',serif;font-size:16px;font-weight:700;color:var(--g);}
.sim-actions{display:flex;gap:6px;}
.btn-ico{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;}
.btn-ico:hover{background:var(--grl);}
.btn-ico.del:hover{background:var(--rp);border-color:rgba(220,38,38,.2);}
.empty-state{text-align:center;padding:40px 20px;background:var(--w);border:1px dashed var(--bd);border-radius:16px;}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.4;}
.empty-state p{font-size:14px;color:var(--gr);margin-bottom:16px;}
.btn-green{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--w);background:var(--g);border:none;border-radius:100px;padding:11px 24px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block;}
.btn-green:hover{background:var(--gm);}
.rename-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:999;}
.rename-modal.show{display:flex;}
.rename-box{background:var(--w);border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.rename-box h3{font-family:'Spectral',serif;font-size:18px;margin-bottom:16px;}
.rename-box input{width:100%;font-family:'Inter',sans-serif;font-size:14px;color:var(--dk);background:var(--cr);border:1.5px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:14px;}
.rename-box input:focus{outline:none;border-color:var(--gl);}
.rename-actions{display:flex;gap:8px;}
.btn-cancel{flex:1;font-family:'Inter',sans-serif;font-size:14px;color:var(--gr);background:none;border:1.5px solid var(--bd);border-radius:100px;padding:10px;cursor:pointer;}
.btn-save{flex:1;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--w);background:var(--g);border:none;border-radius:100px;padding:10px;cursor:pointer;}
.loading{text-align:center;padding:40px;color:var(--gr);}

@media(max-width:768px){
  nav{padding:0 14px;height:56px;}
  .page{padding:80px 16px 32px;}
  .page-header h1{font-size:24px;}
  .user-card{flex-wrap:wrap;gap:12px;padding:16px;}
  .logout-btn{margin-left:0;}
  .sim-card{flex-wrap:wrap;gap:10px;padding:14px;}
  .sim-val{font-size:15px;}
  .sim-actions{margin-left:auto;}
  .rename-box{margin:0 16px;}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nl">
    <div class="nlm"><svg viewBox="10 11 28 25" fill="none"><path d="M13 19L24 13.5L35 19" stroke="#e8b873" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 29V34M24 25V34M30 21V34" stroke="#e8b873" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <span class="nlt">Sumba</span>
  </a>
  <div class="nr">
    <a href="simulateur.html" class="bsm bo">← Simulateur</a>
  </div>
</nav>

<div class="page">
  <div id="loading" class="loading">Chargement...</div>
  <div id="content" style="display:none">
    <div class="page-header">
      <h1>Mon compte</h1>
      <p>Retrouvez et gérez toutes vos simulations sauvegardées.</p>
    </div>
    <div class="user-card">
      <div class="avatar" id="av">?</div>
      <div class="user-info"><strong id="user-name">-</strong><span id="user-email">-</span></div>
      <button class="logout-btn" onclick="logout()">Se déconnecter</button>
    </div>
    <div class="section-title">Mes simulations</div>
    <div class="sims-grid" id="sims-list"></div>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="rename-modal" id="rename-modal">
  <div class="rename-box">
    <h3>Renommer la simulation</h3>
    <input type="text" id="rename-input" placeholder="Ex: Appart Lyon locatif 2025">
    <div class="rename-actions">
      <button class="btn-cancel" onclick="closeRename()">Annuler</button>
      <button class="btn-save" onclick="saveRename()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zrngovgnkkkhnxdytmyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QRu38MszSvnpwZCz0qcQMw_ITzXLjnE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let simulations = [];
let renameId = null;

const ICONS = { capacite:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="#e8b873" stroke-width="1.6"/><path d="M3 10h18" stroke="#e8b873" stroke-width="1.6"/></svg>`, locatif:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 11l7-6 7 6" stroke="#e8b873" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 10v8h10v-8" stroke="#e8b873" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`, mb:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 10l7-5 7 5" stroke="#e8b873" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 9v9h10V9" stroke="#e8b873" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 14h5M12 11.5v5" stroke="#e8b873" stroke-width="1.5" stroke-linecap="round"/></svg>` };
const LABELS = { capacite:'Capacité d\'emprunt', locatif:'Investissement locatif', mb:'Marchand de biens' };

async function init() {
  try {
    // Attendre que la session soit disponible (le SDK peut mettre un instant à
    // traiter le token OAuth présent dans l'URL après une connexion Google).
    let session = (await sb.auth.getSession()).data.session;
    if (!session) {
      session = await attendreSession(2500);
    }
    if (!session) { window.location.href = 'auth.html'; return; }
    user = session.user;
    const prenom = user.user_metadata?.prenom
      || user.user_metadata?.full_name?.split(' ')[0]
      || user.user_metadata?.name?.split(' ')[0] || '';
    const initiale = (prenom || user.email || '?')[0].toUpperCase();
    document.getElementById('av').textContent = initiale;
    document.getElementById('user-name').textContent = prenom || 'Mon compte';
    document.getElementById('user-email').textContent = user.email;
    await loadSims();
  } catch(e) {
    console.error('Erreur init compte:', e);
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// Attend qu'une session s'établisse (utile au retour d'une connexion OAuth Google)
function attendreSession(timeoutMs) {
  return new Promise((resolve) => {
    let resolved = false;
    const sub = sb.auth.onAuthStateChange((_event, session) => {
      if (session && !resolved) { resolved = true; resolve(session); }
    });
    setTimeout(() => {
      if (!resolved) {
        resolved = true;
        sb.auth.getSession().then(({ data }) => resolve(data.session || null));
      }
    }, timeoutMs);
  });
}

async function loadSims() {
  try {
    const { data, error } = await sb.from('simulations').select('*').eq('user_id', user.id).order('updated_at', { ascending: false });
    if (error) { console.error('loadSims error:', error); simulations = []; }
    else simulations = data || [];
  } catch(e) {
    console.error('loadSims exception:', e);
    simulations = [];
  }
  renderSims();
}

function renderSims() {
  const el = document.getElementById('sims-list');
  if (!simulations.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V6M19 19V14" stroke="#c9974f" stroke-width="1.5" stroke-linecap="round"/><path d="M4 20h16" stroke="#c9974f" stroke-width="1.5" stroke-linecap="round"/></svg></div><p>Vous n'avez pas encore de simulation sauvegardée.</p><a href="simulateur.html" class="btn-green">Créer ma première simulation</a></div>`;
    return;
  }
  el.innerHTML = simulations.map(s => {
    const d = s.data || {};
    const ico = ICONS[s.type] || `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V6M19 19V14" stroke="#e8b873" stroke-width="1.6" stroke-linecap="round"/><path d="M4 20h16" stroke="#e8b873" stroke-width="1.6" stroke-linecap="round"/></svg>`;
    const lbl = LABELS[s.type] || s.type;
    const date = new Date(s.updated_at).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
    let val = '-';
    if (s.type==='capacite' && d.capital) val = Math.round(d.capital).toLocaleString('fr-FR')+' €';
    if (s.type==='locatif' && d.cf!=null) val = (d.cf>=0?'+':'')+Math.round(d.cf).toLocaleString('fr-FR')+' €/mois';
    if (s.type==='mb' && d.marge!=null) val = (d.marge>=0?'+':'')+Math.round(d.marge).toLocaleString('fr-FR')+' €';
    return `<div class="sim-card" onclick="openSim('${s.id}')">
      <div class="sim-ico">${ico}</div>
      <div class="sim-info">
        <div class="sim-name">${s.name || lbl}</div>
        <div class="sim-meta">${lbl} · ${date}</div>
      </div>
      <div class="sim-val">${val}</div>
      <div class="sim-actions" onclick="event.stopPropagation()">
        <button class="btn-ico" title="Renommer" onclick="openRename('${s.id}','${(s.name||'').replace(/'/g,"\\'")}')">✏️</button>
        <button class="btn-ico del" title="Supprimer" onclick="deleteSim('${s.id}')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>`;
  }).join('');
}

function openSim(id) {
  const sim = simulations.find(s=>s.id===id);
  if (sim) {
    localStorage.setItem('sumba_load_sim', JSON.stringify(sim));
    window.location.href = 'simulateur.html';
  }
}

function openRename(id, name) {
  renameId = id;
  document.getElementById('rename-input').value = name;
  document.getElementById('rename-modal').classList.add('show');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}
function closeRename() {
  renameId = null;
  document.getElementById('rename-modal').classList.remove('show');
}
async function saveRename() {
  const name = document.getElementById('rename-input').value.trim();
  if (!name || !renameId) return;
  await sb.from('simulations').update({ name }).eq('id', renameId);
  closeRename();
  await loadSims();
}

async function deleteSim(id) {
  if (!confirm('Supprimer cette simulation ?')) return;
  await sb.from('simulations').delete().eq('id', id);
  await loadSims();
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

document.getElementById('rename-input').addEventListener('keydown', e => { if (e.key==='Enter') saveRename(); });
init();
</script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>

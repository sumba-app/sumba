<meta charset="UTF-8">

<title>Connexion… — Sumba</title>
<meta name="robots" content="noindex, nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#eceee9;--ink:#15241d;--ink-2:#46544c;--ink-3:#838d85;--lime:#bff05f;--lime-2:#aee63f;--line:#e4e7df;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;-webkit-font-smoothing:antialiased;padding:24px;}
.logo-mark{width:58px;height:58px;background:var(--lime);border-radius:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(150,220,80,.45);}
.logo-mark svg{width:34px;height:34px;}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--lime-2);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.msg{font-size:15px;color:var(--ink-2);font-weight:500;}
.title{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
.err{display:none;max-width:380px;text-align:center;}
.err a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--lime);}
</style>
</head>
<body>
  <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#15241d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 L12 5.5 L19.5 11.5 V20 H4.5 Z"/><path d="M7.5 17 L10.5 14 L12.5 15.5 L16.2 11.8"/><path d="M13.9 11.8 H16.4 V14.3"/></svg></div>
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <div class="spinner"></div>
    <div class="msg">Connexion en cours…</div>
  </div>
  <div id="error" class="err">
    <div class="title" style="margin-bottom:10px">La connexion a échoué</div>
    <div class="msg">Impossible de finaliser la connexion. <a href="auth.html">Réessayer</a></div>
  </div>

<script>
const SUPABASE_URL = 'https://zrngovgnkkkhnxdytmyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QRu38MszSvnpwZCz0qcQMw_ITzXLjnE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'sumba-auth',
    flowType: 'pkce'
  }
});

async function finaliser() {
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const hasError = url.searchParams.get('error') || url.hash.includes('error');

    if (hasError) throw new Error('Erreur retournée par le fournisseur');

    // Cas flux PKCE (paramètre ?code=...) : échanger le code contre une session.
    // On tente l'échange mais sans bloquer si detectSessionInUrl l'a déjà fait.
    if (code) {
      try {
        await sb.auth.exchangeCodeForSession(window.location.href);
      } catch (exErr) {
        // Si l'échange échoue car déjà consommé par detectSessionInUrl, on ignore
        // et on vérifie la session juste après.
        console.warn('exchangeCodeForSession:', exErr?.message || exErr);
      }
    }

    // Attendre patiemment qu'une session soit disponible (jusqu'à ~6s),
    // en combinant l'écoute d'événement ET des vérifications répétées.
    const session = await attendreSession(6000);

    if (session) {
      const hasDraft = localStorage.getItem('sumba_draft');
      let retour = null;
      try { retour = localStorage.getItem('sumba_retour'); localStorage.removeItem('sumba_retour'); } catch(e){}
      if (retour === 'recap') window.location.replace('simulateur.html?mod=recap&restore=1');
      else if (hasDraft) window.location.replace('simulateur.html?restore=1');
      else window.location.replace('simulateur.html?mod=cap');
    } else {
      throw new Error('Session non établie après authentification');
    }
  } catch (e) {
    console.error('Callback OAuth échoué:', e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
}

// Attend qu'une session existe : écoute onAuthStateChange + re-vérifie toutes les 300ms
function attendreSession(timeoutMs) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (s) => { if (!done) { done = true; resolve(s); } };

    // 1) écoute des changements d'état d'auth
    sb.auth.onAuthStateChange((_e, s) => { if (s) finish(s); });

    // 2) vérifications répétées (au cas où l'événement ne se déclenche pas)
    const start = Date.now();
    const poll = setInterval(async () => {
      if (done) { clearInterval(poll); return; }
      const { data } = await sb.auth.getSession();
      if (data.session) { clearInterval(poll); finish(data.session); }
      else if (Date.now() - start > timeoutMs) { clearInterval(poll); finish(null); }
    }, 300);
  });
}

finaliser();
</script>
</body>
</html>

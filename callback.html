<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion… — Sumba</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--g:#0f2942;--cuivre:#e8b873;--cr:#fbfaf8;--gr:#5a6572;}
body{font-family:'Inter',sans-serif;background:var(--cr);color:var(--g);min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;-webkit-font-smoothing:antialiased;}
.logo-mark{width:54px;height:54px;background:var(--g);border-radius:13px;display:flex;align-items:center;justify-content:center;}
.spinner{width:30px;height:30px;border:3px solid rgba(15,41,66,0.12);border-top-color:var(--cuivre);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.msg{font-size:15px;color:var(--gr);font-weight:300;}
.title{font-family:'Spectral',serif;font-size:22px;font-weight:600;}
.err{display:none;max-width:380px;text-align:center;padding:0 24px;}
.err a{color:var(--g);font-weight:500;}
</style>
</head>
<body>
  <div class="logo-mark"><svg viewBox="10 11 28 25" width="34" height="34" fill="none"><path d="M13 19L24 13.5L35 19" stroke="#e8b873" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 29V34M24 25V34M30 21V34" stroke="#e8b873" stroke-width="2.6" stroke-linecap="round"/></svg></div>
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <div class="spinner"></div>
    <div class="msg">Connexion en cours…</div>
  </div>
  <div id="error" class="err">
    <div class="title" style="margin-bottom:10px">La connexion a échoué</div>
    <div class="msg">Impossible de finaliser la connexion. <a href="auth.html">Réessayer</a></div>
  </div>

<script>
const SUPABASE_URL = 'https://zrngovgnkkkhnxdytmyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QRu38MszSvnpwZCz0qcQMw_ITzXLjnE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'sumba-auth',
    flowType: 'pkce'
  }
});

async function finaliser() {
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');

    // Cas 1 : flux PKCE (paramètre ?code=...) — échanger le code contre une session
    if (code) {
      const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
      if (error) throw error;
    }

    // Cas 2 : flux implicite (jeton dans le #hash) — detectSessionInUrl s'en charge,
    // on laisse un court instant au SDK pour traiter
    await new Promise(r => setTimeout(r, 400));

    // Vérifier qu'on a bien une session
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      // Dernière chance : attendre l'événement d'auth
      session = await new Promise((resolve) => {
        const sub = sb.auth.onAuthStateChange((_e, s) => { if (s) resolve(s); });
        setTimeout(() => resolve(null), 2500);
      });
    }

    if (session) {
      // Connexion réussie : rediriger vers le simulateur (avec restauration éventuelle d'un brouillon)
      const hasDraft = localStorage.getItem('sumba_draft');
      window.location.replace(hasDraft ? 'simulateur.html?restore=1' : 'simulateur.html?mod=cap');
    } else {
      throw new Error('Session non établie après authentification');
    }
  } catch (e) {
    console.error('Callback OAuth échoué:', e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
}

finaliser();
</script>
</body>
</html>

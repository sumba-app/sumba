<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion… — Sumba</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--g:#0f2942;--cuivre:#e8b873;--cr:#fbfaf8;--gr:#5a6572;}
body{font-family:'Inter',sans-serif;background:var(--cr);color:var(--g);min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;-webkit-font-smoothing:antialiased;}
.logo-mark{width:54px;height:54px;background:var(--g);border-radius:13px;display:flex;align-items:center;justify-content:center;}
.spinner{width:30px;height:30px;border:3px solid rgba(15,41,66,0.12);border-top-color:var(--cuivre);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.msg{font-size:15px;color:var(--gr);font-weight:300;}
.title{font-family:'Spectral',serif;font-size:22px;font-weight:600;}
.err{display:none;max-width:380px;text-align:center;padding:0 24px;}
.err a{color:var(--g);font-weight:500;}
</style>
</head>
<body>
  <div class="logo-mark"><svg viewBox="10 11 28 25" width="34" height="34" fill="none"><path d="M13 19L24 13.5L35 19" stroke="#e8b873" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 29V34M24 25V34M30 21V34" stroke="#e8b873" stroke-width="2.6" stroke-linecap="round"/></svg></div>
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <div class="spinner"></div>
    <div class="msg">Connexion en cours…</div>
  </div>
  <div id="error" class="err">
    <div class="title" style="margin-bottom:10px">La connexion a échoué</div>
    <div class="msg">Impossible de finaliser la connexion. <a href="auth.html">Réessayer</a></div>
  </div>

<script>
const SUPABASE_URL = 'https://zrngovgnkkkhnxdytmyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QRu38MszSvnpwZCz0qcQMw_ITzXLjnE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'sumba-auth',
    flowType: 'pkce'
  }
});

async function finaliser() {
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const hasError = url.searchParams.get('error') || url.hash.includes('error');

    if (hasError) throw new Error('Erreur retournée par le fournisseur');

    // Cas flux PKCE (paramètre ?code=...) : échanger le code contre une session.
    // On tente l'échange mais sans bloquer si detectSessionInUrl l'a déjà fait.
    if (code) {
      try {
        await sb.auth.exchangeCodeForSession(window.location.href);
      } catch (exErr) {
        // Si l'échange échoue car déjà consommé par detectSessionInUrl, on ignore
        // et on vérifie la session juste après.
        console.warn('exchangeCodeForSession:', exErr?.message || exErr);
      }
    }

    // Attendre patiemment qu'une session soit disponible (jusqu'à ~6s),
    // en combinant l'écoute d'événement ET des vérifications répétées.
    const session = await attendreSession(6000);

    if (session) {
      const hasDraft = localStorage.getItem('sumba_draft');
      let retour = null;
      try { retour = localStorage.getItem('sumba_retour'); localStorage.removeItem('sumba_retour'); } catch(e){}
      if (retour === 'recap') window.location.replace('simulateur.html?mod=recap&restore=1');
      else if (hasDraft) window.location.replace('simulateur.html?restore=1');
      else window.location.replace('simulateur.html?mod=cap');
    } else {
      throw new Error('Session non établie après authentification');
    }
  } catch (e) {
    console.error('Callback OAuth échoué:', e);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
}

// Attend qu'une session existe : écoute onAuthStateChange + re-vérifie toutes les 300ms
function attendreSession(timeoutMs) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (s) => { if (!done) { done = true; resolve(s); } };

    // 1) écoute des changements d'état d'auth
    sb.auth.onAuthStateChange((_e, s) => { if (s) finish(s); });

    // 2) vérifications répétées (au cas où l'événement ne se déclenche pas)
    const start = Date.now();
    const poll = setInterval(async () => {
      if (done) { clearInterval(poll); return; }
      const { data } = await sb.auth.getSession();
      if (data.session) { clearInterval(poll); finish(data.session); }
      else if (Date.now() - start > timeoutMs) { clearInterval(poll); finish(null); }
    }, 300);
  });
}

finaliser();
</script>
</body>
</html>

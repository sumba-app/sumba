<meta charset="UTF-8">

<title>Connexion | Sumba</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#eceee9;--surface:#ffffff;--surface-2:#f4f6f1;--surface-3:#eef1ea;
  --ink:#15241d;--ink-2:#46544c;--ink-3:#838d85;
  --line:#e4e7df;--lime:#bff05f;--lime-2:#aee63f;--lime-soft:#e9f9c8;
  --forest:#173a2b;--green-acc:#2f8f56;--danger:#c0392b;--danger-soft:#fdeceb;
  --pill:999px;--ease:cubic-bezier(0.16,1,0.3,1);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:70px;}
.nl{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nlm{width:36px;height:36px;background:var(--lime);border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(150,220,80,.45);}
.nlm svg{width:23px;height:23px;}
.nlt{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--ink);}
.nl-back{font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:9px 18px;border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);transition:border-color .2s;}
.nl-back:hover{border-color:var(--ink-3);}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 56px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:40px;width:100%;max-width:430px;box-shadow:0 2px 6px rgba(20,40,30,.05),0 24px 50px rgba(20,40,30,.09);}
.card-logo{display:flex;justify-content:center;margin-bottom:22px;}
.card-logo-mark{width:54px;height:54px;background:var(--lime);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(150,220,80,.45);}
.card-logo-mark svg{width:32px;height:32px;}
.card h1{font-size:26px;font-weight:800;letter-spacing:-0.03em;text-align:center;margin-bottom:7px;}
.card-sub{font-size:14.5px;color:var(--ink-2);text-align:center;margin-bottom:26px;line-height:1.5;}
.tabs{display:flex;gap:4px;background:var(--surface-3);border-radius:14px;padding:4px;margin-bottom:24px;}
.tab{flex:1;padding:10px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-2);background:none;border:none;border-radius:10px;cursor:pointer;transition:all .25s var(--ease);}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,40,30,.1);}
.form{display:flex;flex-direction:column;gap:15px;}
.f{display:flex;flex-direction:column;gap:6px;}
.fl{font-size:13px;font-weight:600;color:var(--ink);}
.fw input{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;transition:all .2s;}
.fw input::placeholder{color:var(--ink-3);}
.fw input:focus{outline:none;border-color:var(--lime-2);box-shadow:0 0 0 3px rgba(174,230,63,.22);background:var(--surface);}
.btn-full{width:100%;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--lime);border:1px solid rgba(20,40,30,.06);border-radius:var(--pill);padding:14px;cursor:pointer;transition:all .25s var(--ease);margin-top:6px;box-shadow:0 6px 18px rgba(150,220,80,.4);}
.btn-full:hover{background:var(--lime-2);transform:translateY(-2px);box-shadow:0 12px 26px rgba(150,220,80,.5);}
.btn-full:disabled{background:var(--surface-3);color:var(--ink-3);cursor:not-allowed;transform:none;box-shadow:none;}
.divider{display:flex;align-items:center;gap:12px;margin:6px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
.divider span{font-size:12px;color:var(--ink-3);font-weight:500;}
.btn-google{width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--pill);padding:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{border-color:var(--ink-3);background:var(--surface-2);}
.msg{padding:11px 15px;border-radius:12px;font-size:13px;text-align:center;display:none;line-height:1.5;}
.msg.ok{background:var(--lime-soft);color:var(--forest);border:1px solid rgba(46,143,86,.2);}
.msg.err{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(192,57,43,.18);}
.msg.show{display:block;}
.legal{font-size:12px;color:var(--ink-3);text-align:center;margin-top:18px;line-height:1.6;}
.legal a{color:var(--green-acc);text-decoration:none;font-weight:600;}
.legal a:hover{text-decoration:underline;}
@media(max-width:520px){nav{padding:0 16px;}.card{padding:30px 22px;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nl">
    <div class="nlm"><svg viewBox="0 0 24 24" fill="none" stroke="#15241d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 L12 5.5 L19.5 11.5 V20 H4.5 Z"/><path d="M7.5 17 L10.5 14 L12.5 15.5 L16.2 11.8"/><path d="M13.9 11.8 H16.4 V14.3"/></svg></div>
    <span class="nlt">Sumba</span>
  </a>
  <a href="index.html" class="nl-back">← Retour</a>
</nav>

<div class="page">
  <div class="card">
    <div class="card-logo">
      <div class="card-logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#15241d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5 L12 5.5 L19.5 11.5 V20 H4.5 Z"/><path d="M7.5 17 L10.5 14 L12.5 15.5 L16.2 11.8"/><path d="M13.9 11.8 H16.4 V14.3"/></svg></div>
    </div>
    <h1 id="card-title">Bon retour !</h1>
    <p class="card-sub" id="card-sub">Connectez-vous pour accéder à vos simulations sauvegardées.</p>

    <div class="tabs">
      <button class="tab on" onclick="switchTab('login')">Connexion</button>
      <button class="tab" onclick="switchTab('signup')">Créer un compte</button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="form">
      <div class="f" id="name-field" style="display:none">
        <div class="fl">Prénom</div>
        <div class="fw"><input type="text" id="prenom" placeholder="Votre prénom"></div>
      </div>
      <div class="f">
        <div class="fl">Email</div>
        <div class="fw"><input type="email" id="email" placeholder="votre@email.com" autocomplete="email"></div>
      </div>
      <div class="f">
        <div class="fl">Mot de passe</div>
        <div class="fw"><input type="password" id="password" placeholder="••••••••" minlength="6" autocomplete="current-password"></div>
      </div>
      <button class="btn-full" id="submit-btn" onclick="handleSubmit()">Se connecter</button>
    </div>

    <div class="divider"><span>ou</span></div>
    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.703-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      Continuer avec Google
    </button>

    <p class="legal">En créant un compte, vous acceptez nos <a href="legal.html#cgu">CGU</a> et notre <a href="legal.html#confidentialite">politique de confidentialité</a>. Vos données ne sont jamais vendues.</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zrngovgnkkkhnxdytmyd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QRu38MszSvnpwZCz0qcQMw_ITzXLjnE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storageKey: 'sumba-auth',
    flowType: 'pkce'
  }
});

let mode = 'login';

function switchTab(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', (i===0&&m==='login')||(i===1&&m==='signup')));
  document.getElementById('name-field').style.display = m==='signup' ? 'block' : 'none';
  document.getElementById('card-title').textContent = m==='login' ? 'Bon retour !' : 'Créer mon compte';
  document.getElementById('card-sub').textContent = m==='login' ? 'Connectez-vous pour accéder à vos simulations.' : 'Gratuit. Sauvegardez et retrouvez toutes vos simulations.';
  document.getElementById('submit-btn').textContent = m==='login' ? 'Se connecter' : 'Créer mon compte gratuit';
  showMsg('','');
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg' + (type ? ' show '+type : '');
  el.textContent = text;
}

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submit-btn');
  if (!email || !password) { showMsg('err','Veuillez remplir tous les champs.'); return; }
  btn.disabled = true;
  btn.textContent = 'Chargement...';
  try {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showMsg('ok','Connexion réussie ! Redirection...');
      setTimeout(() => {
        const params = new URLSearchParams(window.location.search);
        const hasDraft = params.get('draft');
        const retour = params.get('retour');
        // Priorité : retour explicite vers le récap, puis brouillon, sinon espace compte
        if (retour === 'recap') window.location.href = 'simulateur.html?mod=recap&restore=1';
        else if (hasDraft) window.location.href = 'simulateur.html?restore=1';
        else window.location.href = 'compte.html';
      }, 1200);
    } else {
      const prenom = document.getElementById('prenom').value.trim();
      const params2 = new URLSearchParams(window.location.search);
      const hasDraftSignup = params2.get('draft');
      const retourSignup = params2.get('retour');
      let emailRedirect = window.location.origin + '/simulateur.html';
      if (retourSignup === 'recap') emailRedirect += '?mod=recap&restore=1';
      else if (hasDraftSignup) emailRedirect += '?restore=1';
      const { error } = await sb.auth.signUp({ email, password, options: { data: { prenom }, emailRedirectTo: emailRedirect } });
      if (error) throw error;
      try { if (window.va) window.va('event', { name: 'compte_cree' }); } catch(e){}
      try { if (typeof gtag === 'function') gtag('event', 'compte_cree'); } catch(e){}
      showMsg('ok','Compte créé ! Vérifiez votre email pour confirmer votre inscription. Votre simulation sera enregistrée automatiquement à votre retour.');
    }
  } catch(e) {
    const msgs = {
      'Invalid login credentials': 'Email ou mot de passe incorrect.',
      'User already registered': 'Un compte existe déjà avec cet email.',
      'Password should be at least 6 characters': 'Le mot de passe doit contenir au moins 6 caractères.',
      'Unable to validate email address: invalid format': 'Format d\'email invalide.'
    };
    showMsg('err', msgs[e.message] || e.message);
  }
  btn.disabled = false;
  btn.textContent = mode==='login' ? 'Se connecter' : 'Créer mon compte gratuit';
}

async function loginGoogle() {
  // Mémoriser l'intention de retour (récap) pour après le callback OAuth
  const retour = new URLSearchParams(window.location.search).get('retour');
  try { if (retour) localStorage.setItem('sumba_retour', retour); } catch(e){}
  const redirectUrl = window.location.origin + '/callback.html';
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl } });
  if (error) showMsg('err', error.message);
}

// Check si déjà connecté
sb.auth.getSession().then(({ data }) => {
  if (data.session) {
    const params = new URLSearchParams(window.location.search);
    const hasDraft = params.get('draft');
    const retour = params.get('retour');
    if (retour === 'recap') window.location.href = 'simulateur.html?mod=recap&restore=1';
    else if (hasDraft) window.location.href = 'simulateur.html?restore=1';
    else window.location.href = 'compte.html';
  }
});

// Enter key
document.addEventListener('keydown', e => { if (e.key==='Enter') handleSubmit(); });
</script>
